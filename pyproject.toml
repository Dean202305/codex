[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-screening"
version = "0.1.0"
description = "Resume screening CLI for 小A招聘表"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "python-pptx>=0.6",
  "httpx>=0.27",
  "fastapi>=0.111",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
desktop = ["pywebview>=5.0", "pyinstaller>=6.0"]

[project.scripts]
resume-screening = "resume_screening.cli:app"
resume-screening-desktop = "resume_screening.desktop_app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"resume_screening.web" = ["static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
