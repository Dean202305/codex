default_source_channel: ""
default_interviewer: ""
index_path: "data/processed_index.json"
ocr_command: "tesseract"

model:
  provider: "openai-compatible"
  base_url: ""
  api_key: ""
  model: ""
  timeout_seconds: 60
  temperature: 0.1
  allow_without_model: false
  fallback_to_local_when_unavailable: true
  local:
    runtime: "llama.cpp"
    model_family: "qwen3.5"
    model_display_name: "Qwen3.5 本地模型"
    model_path: ""
    manifest_path: "models/qwen/manifest.json"
    host: "127.0.0.1"
    port: 18080
    context_size: 8192
    threads: 0
    gpu_layers: "auto"
    auto_start: true
    auto_download: false

screening:
  score_pass: 7
  score_excellent: 9
  categories:
    recommend: "推荐初试"
    consider: "可考虑"
    manual: "待人工二筛"
    reject: "未通过"
