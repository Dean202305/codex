resume_dir: "/Users/mac/Downloads"
job_book: "/Users/mac/Downloads/小A自动化岗位说明书_副本.xlsx"
result_book: "/Users/mac/Downloads/小A科技（北京）组织招聘.xlsx"

job_aliases: {}
# 示例：
# job_aliases:
#   后端开发工程师: "全栈"
#   后端开发实习岗: "全栈"

